<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farm Feed | Keriet Farm</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/feed.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-mark">KF</span>
      <span><strong>Keriet Farm</strong><small>Fresh from our farm</small></span>
    </a>
    <nav><a href="/">Shop</a><a href="/feed.html">Farm Feed</a></nav>
  </header>

  <main>
    <section class="feed-hero">
      <div>
        <p class="eyebrow">Keriet Farm Feed</p>
        <h1>Harvest news, offers and stories from our farm.</h1>
        <p class="lead">Follow availability, harvests, loyalty news and announcements.</p>
        <a class="button" href="/">Return to shop</a>
      </div>
      <img src="/images/farm-feed.svg" alt="Keriet Farm landscape">
    </section>

    <section class="section">
      <div class="section-heading">
        <div><p class="eyebrow">Latest updates</p><h2>What is happening at Keriet Farm</h2></div>
      </div>
      <div id="feed-message" class="message" hidden></div>
      <div id="feed-grid" class="feed-grid"><p>Loading farm updates…</p></div>
    </section>
  </main>

  <footer><strong>Keriet Farm</strong><a href="/">Return to shop</a></footer>
</body>
</html>
