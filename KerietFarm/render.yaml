services:
  - type: web
    name: keriet-farm
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /var/data/store.json
    disk:
      name: keriet-farm-data
      mountPath: /var/data
      sizeGB: 1
